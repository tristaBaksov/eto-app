name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/tristabaksov

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint backend Dockerfile 
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error

      - name: Lint YAML
        run: |
          pip install yamllint
          yamllint -d relaxed docker-compose.yml .github/workflows/

      - name: Python syntax check
        run: python -m compileall -q backend/app

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
        - uses: actions/checkout@v4

        - uses: docker/setup-buildx-action@v3

        - name: Log in to GHCR
          if: github.event_name != 'pull_request'
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and push 
          uses: docker/build-push-action@v6
          with:
            context: ${{ matrix.service }}
            push: ${{ github.event_name != 'pull_request' }}
            tags: | 
              ${{ env.IMAGE_PREFIX }}/eto-${{ matrix.service }}:${{ github.sha }}
              ${{ env.IMAGE_PREFIX }}/eto-${{ matrix.service }}:latest
            cache-from: type=gha,scope=${{ matrix.service }}
            cache-to: type=gha,mode=max,scope=${{ matrix.service }}
